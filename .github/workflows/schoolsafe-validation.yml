name: Validate Segurança Escolar

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, changed auth/UI lint, and auth API syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint changed authentication and branding screens
        run: npx eslint app/login.tsx context/auth-context.tsx context/alerts-context.tsx components/schoolsafe/header.tsx components/schoolsafe/sensor-card.tsx components/schoolsafe/sensor-screen.tsx components/schoolsafe/monitor-card.tsx 'app/(tabs)/index.tsx' 'app/(tabs)/registro.tsx' 'app/(tabs)/_layout.tsx' app/_layout.tsx
      - name: Authentication server syntax
        run: node --check server/index.mjs
      - name: Validate JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('app.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('server/package.json','utf8'))"
